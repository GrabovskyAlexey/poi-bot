spring:
  application:
    name: poibot
  datasource:
    url: ${PG_URL}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: liquibase/changelog.xml
  jpa:
    show-sql: false
    open-in-view: false

telegram:
  name: ${TELEGRAM_BOT_NAME}
  token: ${TELEGRAM_BOT_TOKEN}
server:
  port: ${USE_PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: ./logs/bot.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    ru:
      grabovsky:
        poibot: debug
